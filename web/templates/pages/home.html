{{ define "content" }}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1>KDocs</h1>
        <p class="text-muted mb-0">
            Internal engineering knowledge and documentation.
        </p>
    </div>

    <a href="/pages/new" class="btn btn-primary">
        New Page
    </a>
</div>

<h2 class="h4 mb-3">Spaces</h2>

<div class="row g-4">
    {{ range .Spaces }}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100">
                <div class="card-body">
                    <h3 class="h5">
                        <a
                            href="/spaces/{{ .Slug }}"
                            class="text-decoration-none"
                        >
                            {{ .Name }}
                        </a>
                    </h3>

                    <a
                        href="/spaces/{{ .Slug }}"
                        class="btn btn-outline-primary btn-sm"
                    >
                        View Space
                    </a>
                </div>
            </div>
        </div>
    {{ end }}
</div>

{{ end }}
