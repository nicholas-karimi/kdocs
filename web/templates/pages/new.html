{{ define "content" }}
<h1 class="mb-4">Create Page</h1>

<form method="POST" action="/pages">

    <div class="mb-3">
        <label for="title" class="form-label">Title</label>

        <input
            type="text"
            id="title"
            name="title"
            class="form-control"
            required
        >
    </div>

    <div class="mb-3">
        <label for="slug" class="form-label">Slug</label>

        <input
            type="text"
            id="slug"
            name="slug"
            class="form-control"
            required
        >

        <div class="form-text">
            Example: postgres-cli-guide
        </div>
    </div>

    <div class="mb-3">
        <label for="space_slug" class="form-label">Space</label>

        <select
            id="space_slug"
            name="space_slug"
            class="form-select"
            required
        >
            {{ range .Spaces }}
                <option value="{{ .Slug }}">
                    {{ .Name }}
                </option>
            {{ end }}
        </select>
    </div>

    <div class="mb-3">
        <label for="content" class="form-label">Content</label>

        <textarea
            id="content"
            name="content"
            class="form-control"
            rows="20"
            required
        ></textarea>

        <div class="form-text">
            Write the page using Markdown.
        </div>
    </div>

    <button type="submit" class="btn btn-primary">
        Create Page
    </button>

</form>
{{ end }}
